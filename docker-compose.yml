services:
  app:
    image: vayla-laravel:dev
    pull_policy: never
    container_name: vayla-app
    build:
      context: ./laravel
      dockerfile: Dockerfile
    ports:
      - '${APP_PORT:-8070}:8080'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: corekit
      DB_PASSWORD: corekit
      DB_DATABASE: vayla_db
    env_file: ./laravel/.env
    volumes:
      - './laravel:/var/www/html'
    depends_on:
      - postgres
    networks:
      - vayla-network

  postgres:
    image: postgres:16
    container_name: vayla-db
    volumes:
      - vayla-db:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5437}:5432'
    environment:
      POSTGRES_USER: corekit
      POSTGRES_PASSWORD: corekit
      POSTGRES_DB: vayla_db
    networks:
      - vayla-network

  node:
    image: node:20
    container_name: vayla-node
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    ports:
      # 5174 : 5173 est pris par un autre projet sur cette machine, et un
      # port non publié fait servir les assets du voisin (voir vite.config.js).
      - '5174:5174'
    environment:
      - CHOKIDAR_USEPOLLING=true
    # Vite ne doit pas dépendre d'un aller-retour vers le registre npm pour
    # démarrer. Un `npm install` inconditionnel au démarrage bloque le serveur
    # de développement tant qu'il n'a pas répondu — et quand il se fige, le
    # port 5174 accepte la connexion sans que rien n'écoute derrière :
    # le navigateur affiche ERR_CONNECTION_RESET sur @vite/client, la page
    # reste blanche, et rien n'indique que la cause est npm.
    # On n'installe donc que si les dépendances manquent ; après un changement
    # de package.json, `make npm-install`.
    #
    # Et le cache d'optimisation (`node_modules/.vite`) est vidé à chaque
    # démarrage : conservé d'un démarrage à l'autre, il laissait la liste des
    # pages d'`import.meta.glob` vide — `Object.assign({})`, « Page not found »
    # sur tout le site — dès que le conteneur repartait sans que personne pense
    # à le purger à la main. Le prix : quelques secondes d'optimisation au
    # démarrage.
    command: sh -c "rm -rf node_modules/.vite; [ -x node_modules/.bin/vite ] || npm install --no-audit --no-fund; npm run dev -- --host 0.0.0.0"
    networks:
      - vayla-network

volumes:
  vayla-db:

networks:
  vayla-network:
    external: true
