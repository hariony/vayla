user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Où nginx range un corps de requête trop gros pour sa mémoire tampon —
    # c'est-à-dire **toute photo envoyée**. Par défaut, /var/lib/nginx/tmp :
    # le Dockerfile donne bien `tmp` à www-data, mais son parent /var/lib/nginx
    # appartient à nginx en 750, et www-data ne peut pas y entrer. Chaque
    # téléversement tombait sur une erreur 500 (« Permission denied » dans
    # error.log) avant même d'atteindre PHP — invisible aux tests, qui ne
    # passent pas par nginx. /tmp est à tout le monde ; nginx y crée ces
    # dossiers au démarrage, au nom de www-data.
    client_body_temp_path /tmp/nginx-corps;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    client_body_buffer_size 512k;

    include /etc/nginx/http.d/*.conf;
}
