; ─────────────────────────────────────────────────────────────
; Configuration PHP — profil DÉVELOPPEMENT
; En production, surcharger la section Opcache (voir plus bas)
; ─────────────────────────────────────────────────────────────

; Erreurs — on affiche en dev, à passer à Off en prod
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php_errors.log

; Performance
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Upload
upload_max_filesize = 50M
post_max_size = 50M

; Timezone
date.timezone = Indian/Antananarivo

; Opcache
; validate_timestamps = 1 est INDISPENSABLE en dev : sinon PHP sert du code
; en cache et chaque modification exige un redémarrage du conteneur.
; En production : validate_timestamps = 0 et revalidate_freq = 0.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
